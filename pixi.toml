[workspace]
name = "omni-scfm"
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge", "bioconda", "https://prefix.dev/almost-conductor"]
platforms = ["linux-64"]
version = "0.1.0"

# Top-level (implicit "default" feature) deps are shared by every environment.
[dependencies]
python = ">=3.10,<3.13"

# --- features ---------------------------------------------------------------
# base: the shared scientific env behind src/omni_scfm and the light modules
[feature.base.dependencies]
scanpy = "*"
anndata = "*"
pandas = "*"
pyarrow = "*"
pytest = "*"
openpyxl = "*"  # read the paper's source_data/*.xlsx for the reproduction check

# omnidata: the data-download env (hapiq from the almost-conductor channel)
[feature.omnidata.dependencies]
hapiq = "*"
bash = "*"

# dashboard: Streamlit results explorer (stlite-compatible: pandas + altair).
[feature.dashboard.dependencies]
streamlit = "*"
altair = "*"

[feature.dashboard.tasks]
dashboard = "streamlit run dashboard/app.py"   # pixi run dashboard

# gears: GEARS (cell-gears) for the GO-filtered simulation split AND the GEARS
# method (M3). CPU is fine for the split. GEARS pins Python 3.10.
[feature.gears.dependencies]
python = "3.10.*"
pip = "*"

# Pinned to the paper's gears_env2.yml for a bit-exact split + faithful GEARS method.
# (prepare_perturbation_data.py asserts gears.version == '0.1.2'.)
[feature.gears.pypi-dependencies]
cell-gears = "==0.1.2"
numpy = "==1.26.4"
# CPU-only torch (split + CPU inference need no CUDA; avoids the ~2GB CUDA wheel).
torch = { version = "==2.3.0", index = "https://download.pytorch.org/whl/cpu" }
torch-geometric = "==2.5.3"
scanpy = "==1.10.1"

# r: Bioconductor env to run the paper's R scripts verbatim (mean, lpm, ...).
# Reads .h5ad via picklerick (native Rust->R, no basilisk/Python); zellkonverter
# stays installed only so the scripts' `zellkonverter::readH5AD` resolves —
# wrapper.R swaps its implementation to picklerick. picklerick needs r-base >=4.5.
[feature.r]
channels = ["https://prefix.dev/edge", "conda-forge", "bioconda"]

[feature.r.dependencies]
r-base = ">=4.5,<4.6"
r-picklerick = "*"
bioconductor-genomeinfodbdata = "*"  # data pkg conda doesn't auto-pull for GenomeInfoDb
bioconductor-singlecellexperiment = "*"
bioconductor-glmgampoi = "*"
bioconductor-zellkonverter = "*"
bioconductor-matrixgenerics = "*"
r-tidyverse = "*"
r-argparser = "*"
r-rjson = "*"
r-tidylog = "*"
r-irlba = "*"        # linear pretrained model (PCA embeddings)
r-skimr = "*"        # lpm summary printout
"r-data.table" = "*" # quoted: the dot is part of the package name, not a TOML table

# --- environments (pixi solves each independently) --------------------------
[environments]
default = { features = ["base"] }
omnidata = { features = ["omnidata"] }
r = { features = ["r"] }
gears = { features = ["gears"] }
dashboard = { features = ["base", "dashboard"] }

# --- env export tasks: pixi -> envs/*.yml that benchmark.yaml references -----
[tasks]
export-base = "pixi workspace export conda-environment --environment default envs/base.yml"
export-omnidata = "pixi workspace export conda-environment --environment omnidata envs/omni-data.yml"
export-r = "pixi workspace export conda-environment --environment r envs/r.yml"
export-gears = "bash scripts/export_gears_env.sh"  # full pinned pip closure (not the minimal export)
# Collect metrics for one run: `pixi run collect [OUT_DIR] [-o SCORES.parquet]`
# (defaults to ./out -> ./out/scores.parquet). Pass another run's dir explicitly.
collect = { cmd = "python -m omni_scfm.collect", env = { PYTHONPATH = "src" } }
