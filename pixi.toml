[workspace]
name = "omni-scfm"
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge", "bioconda", "https://prefix.dev/almost-conductor"]
platforms = ["linux-64"]
version = "0.1.0"

# Top-level (implicit "default" feature) deps are shared by every environment.
[dependencies]
python = ">=3.10,<3.13"

# --- features ---------------------------------------------------------------
# base: the shared scientific env behind src/omni_scfm and the light modules
[feature.base.dependencies]
scanpy = "*"
anndata = "*"
pandas = "*"
pyarrow = "*"
pytest = "*"
openpyxl = "*"  # read the paper's source_data/*.xlsx for the reproduction check

# omnidata: the data-download env (hapiq from the almost-conductor channel)
[feature.omnidata.dependencies]
hapiq = "*"
bash = "*"

# dashboard: Streamlit results explorer (stlite-compatible: pandas + altair).
[feature.dashboard.dependencies]
streamlit = "*"
altair = "*"

[feature.dashboard.tasks]
dashboard = "streamlit run dashboard/app.py"   # pixi run dashboard

# gears: GEARS (cell-gears) for the GO-filtered split + the GEARS method.
# Core deps via CONDA (conda-forge resolves the transitive closure reliably —
# conda's pip silently drops pinned-but-also-conda packages like pandas/
# typing_extensions). cell-gears (PyPI-only) is installed with pip --no-deps so
# its over-strict == pins don't fight the conda-resolved versions. Versions
# pinned to the paper's gears_env2.yml where it matters for the split
# (cell-gears 0.1.2 — asserted by prepare_perturbation_data.py — + numpy 1.26).
# CPU torch (conda-forge default on linux; no CUDA needed for the split).
[feature.gears.dependencies]
python = "3.10.*"
pip = "*"
pytorch = "2.3.*"
pytorch_geometric = "2.5.*"
numpy = "1.26.*"
pandas = ">=2.2"
scanpy = "1.10.*"
anndata = ">=0.10"
scikit-learn = ">=1.5"
scipy = ">=1.11"
networkx = ">=3"
h5py = "*"
tqdm = "*"
dcor = "*"
requests = "*"
typing_extensions = "*"
session-info = "*"

[feature.gears.tasks]
# cell-gears is PyPI-only; its loose deps are already provided by the conda deps
# above, so plain pip install just adds the wheel (matches OB's envs/gears.yml).
gears-postinstall = "python -m pip install cell-gears==0.1.2"

# gears-gpu: identical pinned stack as `gears` (so cell-gears 0.1.2 is happy) but
# the CUDA pytorch build (`pytorch-gpu` selector) for the GEARS method, which
# hardcodes device='cuda' and trains a GNN. Kept separate so the bit-exact CPU
# `gears` env (additive) is untouched. Mirror: envs/gears-gpu.yml.
[feature.gears-gpu.dependencies]
python = "3.10.*"
pip = "*"
pytorch-gpu = "2.3.*"
pytorch_geometric = "2.5.*"
numpy = "1.26.*"
pandas = ">=2.2"
scanpy = "1.10.*"
anndata = ">=0.10"
scikit-learn = ">=1.5"
scipy = ">=1.11"
networkx = ">=3"
h5py = "*"
tqdm = "*"
dcor = "*"
requests = "*"
typing_extensions = "*"
session-info = "*"

[feature.gears-gpu.tasks]
gears-gpu-postinstall = "python -m pip install cell-gears==0.1.2"

# omnipath: analysis-only env for the one-time OmniPath fetch + centrality compute
# (scripts/gene_centrality.py -> data/gene_centrality.csv). Kept separate so the
# fetch's deps never touch the bit-exact gears env; the dashboard reads the cached
# CSV and needs none of this at serve time.
[feature.omnipath.dependencies]
python = "3.12.*"
networkx = ">=3"
pandas = ">=2.2"
scipy = "*"          # networkx pagerank needs it
pyarrow = "*"
pip = "*"

[feature.omnipath.pypi-dependencies]
omnipath = "*"

# pixi (unlike conda) doesn't auto-detect the CUDA driver, so the conda-forge
# `pytorch-gpu` build won't resolve without declaring CUDA is available. (On the
# GPU box, OB's `conda --use-conda` build of envs/gears-gpu.yml detects __cuda
# itself, so this is only needed for local pixi installs.)
[feature.gears-gpu.system-requirements]
cuda = "12"

# scfoundation-gpu: the scFoundation method (forked GEARS 0.0.2 + a maeautobin encoder
# backbone). All-pip like cpa-gpu; torch 2.0.1's default PyPI wheel is cu117; the encoder
# uses local-attention (no flash-attn). The forked gears 0.0.2 is vendored and put on
# sys.path by the module — pip cell-gears 0.1.2 only supplies shared deps. Mirror:
# envs/scfoundation-gpu.yml (hand-maintained for OB).
[feature.scfoundation-gpu.dependencies]
python = "3.10.*"
pip = "*"

[feature.scfoundation-gpu.pypi-dependencies]
torch = "==2.0.1"
torchvision = "==0.15.2"   # scFoundation encoder (modules/encoders.py) imports it
torch-geometric = "==2.5.3"
cell-gears = "==0.1.2"
einops = "==0.8.0"
local-attention = "==1.9.14"
omegaconf = "==2.3.0"      # scFoundation encoder config (modules/encoders.py)
torch-summary = "==1.4.5"
numpy = "==1.26.4"
scipy = "==1.13.1"
scanpy = "==1.10.1"
session-info = "==1.0.0"

[feature.scfoundation-gpu.system-requirements]
cuda = "12"

# r: Bioconductor env to run the paper's R scripts verbatim (mean, lpm, ...).
# Reads .h5ad via picklerick (native Rust->R, no basilisk/Python); zellkonverter
# stays installed only so the scripts' `zellkonverter::readH5AD` resolves —
# wrapper.R swaps its implementation to picklerick. picklerick needs r-base >=4.5.
[feature.r]
channels = ["https://prefix.dev/edge", "conda-forge", "bioconda"]

[feature.r.dependencies]
r-base = ">=4.5,<4.6"
r-picklerick = "*"
bioconductor-genomeinfodbdata = "*"  # data pkg conda doesn't auto-pull for GenomeInfoDb
bioconductor-singlecellexperiment = "*"
bioconductor-glmgampoi = "*"
bioconductor-zellkonverter = "*"
bioconductor-matrixgenerics = "*"
r-tidyverse = "*"
r-argparser = "*"
r-rjson = "*"
r-tidylog = "*"
r-irlba = "*"        # linear pretrained model (PCA embeddings)
r-skimr = "*"        # lpm summary printout
"r-data.table" = "*" # quoted: the dot is part of the package name, not a TOML table

# cpa-gpu: the CPA method (run_cpa.py) — a cpa-tools autoencoder that trains on GPU.
# Unlike gears, the stack is the paper's tightly-coupled all-pip set (cpa-tools 0.8.8
# pins scvi-tools 0.20.3 / lightning 1.9.5, which need numpy<1.24 + the old anndata
# 0.9 / scanpy 1.10 API), so it's declared as pypi-dependencies with python+pip from
# conda. torch==2.0.0's default PyPI wheel is the cu117 build (validated). cell-gears
# is here only so run_cpa.py's PertData.load can read the bit-exact substrate (it
# never runs the GEARS model). Mirror: envs/cpa-gpu.yml (hand-maintained for OB, like
# gears). Scoped to norman_from_scfoundation in benchmark.yaml.
[feature.cpa-gpu.dependencies]
python = "3.10.*"
pip = "*"
# cpa-tools 0.8.8 (via its deps) caps these build/meta packages; pixi's conda solve
# otherwise floats them to versions uv can't override -> resolution conflict.
setuptools = "70.0.*"   # cpa-tools pins setuptools<70.1
packaging = "24.*"      # cpa-tools->lightning 2.2.x pins packaging<25

[feature.cpa-gpu.pypi-dependencies]
torch = "==2.0.0"
torch-geometric = "==2.5.3"   # cell-gears PertData import needs PyG
cpa-tools = "==0.8.8"
scvi-tools = "==0.20.3"
pytorch-lightning = "==1.9.5"
cell-gears = "==0.1.2"
pyarrow = "==18.1.0"          # scvi/cpa use pyarrow.PyExtensionType, dropped in newer pyarrow
numpy = "==1.23.5"
scipy = "==1.12.0"
pandas = "==2.2.2"
anndata = "==0.9.2"
scanpy = "==1.10.1"
scikit-learn = "==1.5.0"
numba = "==0.58.1"
session-info = "==1.0.0"

# Same __cuda caveat as gears-gpu: pixi doesn't auto-detect the driver for local installs.
[feature.cpa-gpu.system-requirements]
cuda = "12"

# scgpt-gpu: the scGPT method (run_scgpt.py = a pretrained scGPT TransformerGenerator
# fine-tuned on the GEARS dataloader). BIT-FAITHFUL to the paper's flashattn_env: torch
# 1.13.1 (PyPI default == cu117, like the paper's +cu117), torchtext 0.14.0 (classic
# GeneVocab API — no shim), flash-attn 1.0.4 (use_fast_transformer=True needs it),
# scgpt 0.2.1, cell-gears 0.0.2 (the fork; vendored fork shadows it for
# norman_from_scfoundation). The full frozen pin set lives in envs/scgpt-gpu.yml (what
# OB builds); this curated subset is for local pixi dev. scgpt/cell-gears/flash-attn go
# through the postinstall task (--no-deps to dodge cell-gears' strict pins; flash-attn
# --no-build-isolation so torch is importable at its CUDA-extension build). Mirror style:
# the gears-postinstall + scfoundation-gpu features.
# The nvidia channel supplies the CUDA 11.7 toolkit (nvcc + headers) used to COMPILE
# flash-attn 1.0.4 from source — torch's pip wheel ships only the CUDA *runtime*
# (cudnn/cublas/nvrtc), never nvcc, so the build needs an env-local 11.7 toolkit (matching
# torch's cu117). Pinning it here makes the GPU-box build reproducible (no system CUDA assumed).
[feature.scgpt-gpu]
channels = ["nvidia", "conda-forge", "bioconda"]

[feature.scgpt-gpu.dependencies]
python = "3.10.*"
pip = "*"
cuda-nvcc = "11.7.*"        # nvcc, to compile flash-attn 1.0.4's CUDA extension (cu117)
cuda-cudart-dev = "11.7.*"  # CUDA runtime headers the build #includes

[feature.scgpt-gpu.pypi-dependencies]
torch = "==1.13.1"            # PyPI default wheel == the cu117 build (== paper's +cu117)
torchvision = "==0.14.1"
# torchtext 0.14.0 is installed --no-deps in the postinstall: its metadata pins
# torch==1.13.0 *exactly*, which makes the solve unsatisfiable against the paper's
# torch 1.13.1 — but 0.14.0 runs fine on 1.13.1 (what the paper's env actually did).
torch-geometric = "==2.5.3"
numpy = "==1.23.5"
scipy = "==1.13.0"
pandas = "==2.2.2"
scikit-learn = "==1.5.0"
scanpy = "==1.10.1"
anndata = "==0.10.7"
networkx = "==3.3"
numba = "==0.59.1"
h5py = "==3.11.0"
einops = "==0.8.0"
orbax = "==0.1.7"
ninja = "*"                  # flash-attn 1.0.4 builds its CUDA extension with ninja
# NB: don't pin `packaging` here — the conda `pip` pins it (26.x) and a pypi `==24.0`
# (the paper's value) makes the solve unsatisfiable. packaging is a build/meta tool with
# no numerical effect, so the conda-resolved version is fine (envs/scgpt-gpu.yml, the
# OB-faithful all-pip env, keeps the exact 24.0 pin).
session-info = "==1.0.0"

[feature.scgpt-gpu.tasks]
# scgpt, the forked cell-gears 0.0.2, and torchtext 0.14.0 are --no-deps (their strict
# == pins fight the resolved stack — torchtext pins torch==1.13.0, cell-gears its own
# closure); flash-attn 1.0.4 is --no-build-isolation so the already-installed torch is
# importable while it compiles its CUDA ext against the env-local cuda-nvcc 11.7. Run
# after `pixi install -e scgpt-gpu`.
# PRE-AUTHORIZED FALLBACK (if the 1.0.4 source build still fights the box): relax ONLY
# flash-attn — keep torch/scgpt/cell-gears bit-faithful and either swap in a prebuilt
# flash-attn that still exposes FlashMHA, or set use_fast_transformer=False (a one-line,
# documented deviation à la scfoundation's batch=4). Do NOT escape the rest to a newer stack.
scgpt-postinstall = """python -m pip install --no-deps scgpt==0.2.1 cell-gears==0.0.2 torchtext==0.14.0 \
&& python -m pip install --no-build-isolation flash-attn==1.0.4"""

# Same __cuda caveat as gears-gpu: pixi doesn't auto-detect the driver for local installs.
[feature.scgpt-gpu.system-requirements]
cuda = "12"

# --- environments (pixi solves each independently) --------------------------
[environments]
default = { features = ["base"] }
omnidata = { features = ["omnidata"] }
r = { features = ["r"] }
gears = { features = ["gears"] }
gears-gpu = { features = ["gears-gpu"] }
cpa-gpu = { features = ["cpa-gpu"] }
scfoundation-gpu = { features = ["scfoundation-gpu"] }
scgpt-gpu = { features = ["scgpt-gpu"] }
omnipath = { features = ["omnipath"] }
dashboard = { features = ["base", "dashboard"] }

# --- env export tasks: pixi -> envs/*.yml that benchmark.yaml references -----
[tasks]
export-base = "pixi workspace export conda-environment --environment default envs/base.yml"
export-omnidata = "pixi workspace export conda-environment --environment omnidata envs/omni-data.yml"
export-r = "pixi workspace export conda-environment --environment r envs/r.yml"
# (gears env is declarative conda + pip --no-deps cell-gears; envs/gears.yml is
#  hand-maintained to mirror the gears feature — no export needed.)
# Collect metrics for one run: `pixi run collect [OUT_DIR] [-o SCORES.parquet]`
# (defaults to ./out -> ./out/scores.parquet). Pass another run's dir explicitly.
collect = { cmd = "python -m omni_scfm.collect", env = { PYTHONPATH = "src" } }
# Side-load the GEARS gene2go vocabulary once into data/godata/ (md5-pinned). The
# split/method modules default to data/godata/gene2go_all.pkl; run this before `ob run`
# so GEARS doesn't re-download ~9MB per split/method/seed. See modules/godata/gene2go.
fetch-godata = "bash modules/godata/gene2go/run.sh --output_dir data/godata"
# Side-load the GEARS precomputed GO-essential graph (Dataverse 6934319, md5-pinned) into
# data/godata/. scFoundation needs it — without it the forked GEARS rebuilds it via a
# ~99M-pair single-threaded loop (HOURS). See modules/godata/go_essential.
fetch-go-essential = "bash modules/godata/go_essential/run.sh --output_dir data/godata"
# Side-load the scFoundation checkpoint (~GB) into data/scfoundation/ from a URL you
# provide: `OMNI_SCFOUNDATION_URL='https://…|file:///…' pixi run fetch-scfoundation-model`.
fetch-scfoundation-model = "bash modules/godata/scfoundation_model/run.sh --output_dir data/scfoundation"
# Side-load the scGPT whole-human checkpoint DIR into data/scgpt/scGPT_human/ (hash-pinned).
# Primary: copy a local mirror — `OMNI_SCGPT_URL='file:///abs/scGPT_human' pixi run fetch-scgpt-model`;
# else gdown the public Drive folder (default OMNI_SCGPT_URL=gdrive://<id>). See [[scgpt-method]].
fetch-scgpt-model = "bash modules/godata/scgpt_model/run.sh --output_dir data/scgpt"
