# OmniBenchmark module configuration (repo root).
#
# This monorepo exposes every local module as a NAMED entrypoint here. In
# benchmark.yaml a module references one via `repository: {url: ".", entrypoint: <key>}`,
# so all modules live in this single repo instead of one repo per module.
entrypoints:
  # NB: gene2go is NOT an OB entrypoint — it's side-loaded (`pixi run fetch-godata`),
  # because OB 0.5.1 can't wire one global artifact into per-dataset lineages. See
  # modules/godata/gene2go/run.sh.
  preprocess: modules/preprocess/run.py
  split: modules/split/run.sh
  ground_truth: modules/methods/ground_truth/run.py
  mean: modules/methods/mean/run.sh
  lpm: modules/methods/lpm/run.sh
  transfer: modules/methods/transfer/run.sh
  # lpm variants: same run_linear_pretrained_model.R, one embedding swapped (the paper's
  # alt_embedding arm). The *PertEmb ones read a side-loaded tsv from data/embeddings/.
  lpm_gearsPertEmb: modules/methods/lpm_gearsPertEmb/run.sh
  lpm_k562PertEmb: modules/methods/lpm_k562PertEmb/run.sh
  lpm_rpe1PertEmb: modules/methods/lpm_rpe1PertEmb/run.sh
  lpm_randomPertEmb: modules/methods/lpm_randomPertEmb/run.sh
  lpm_randomGeneEmb: modules/methods/lpm_randomGeneEmb/run.sh
  additive: modules/methods/additive/run.sh
  gears: modules/methods/gears/run.sh
  cpa: modules/methods/cpa/run.sh
  scfoundation: modules/methods/scfoundation/run.sh
  scgpt: modules/methods/scgpt/run.sh
