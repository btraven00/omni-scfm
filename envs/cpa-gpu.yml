name: cpa-gpu
channels:
- conda-forge
- bioconda
# Env for the CPA method (run_cpa.py). Derived from the paper's cpa_env3.yml,
# curated down to the load-bearing pins (the paper export carried both cu11 AND
# cu12 nvidia wheels + a full jupyter/ray dev stack — dropped here).
#
# CPA's stack is tightly coupled: cpa-tools 0.8.8 pins scvi-tools 0.20.3 /
# pytorch-lightning 1.9.5, which need numpy<1.24 (numba 0.58) and the older
# anndata 0.9 / scanpy 1.10 API. Keep these exact. torch comes from the pip cu118
# wheel (self-contained CUDA — sidesteps pixi's __cuda detection; see
# gears-gpu-env-and-shim notes).
#
# cell-gears 0.1.2 is here only so run_cpa.py's `PertData.load` can read the
# already-bit-exact substrate (the script never runs the GEARS model). CPA is
# scoped to norman_from_scfoundation; the scfoundation-fork GEARS 0.0.2 is NOT
# needed here (it belongs to the future scfoundation method) — see the rename
# dodge in modules/methods/cpa/run.sh.
#
# NB: NOT yet validated on the GPU box — mirror gears-gpu's path (OB builds it via
# snakemake --use-conda, which detects the CUDA driver). Validate end-to-end on the
# 24GB box before a production run.
dependencies:
- python 3.10.*
- pip
- setuptools=70.0.*   # cpa-tools 0.8.8 pins setuptools<70.1 (else strict resolvers conflict)
- packaging=24.*      # cpa-tools->lightning 2.2.x pins packaging<25
- pip:
  - torch==2.0.0
  - torch-geometric==2.5.3   # cell-gears PertData import needs PyG (paper pin)
  - cpa-tools==0.8.8
  - scvi-tools==0.20.3
  - pytorch-lightning==1.9.5
  - cell-gears==0.1.2
  - pyarrow==18.1.0          # scvi/cpa use pyarrow.PyExtensionType, removed in newer pyarrow
  - numpy==1.23.5
  - scipy==1.12.0
  - pandas==2.2.2
  - anndata==0.9.2
  - scanpy==1.10.1
  - scikit-learn==1.5.0
  - numba==0.58.1
  - session-info==1.0.0
