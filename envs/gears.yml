name: gears
channels:
- conda-forge
- bioconda
# Core deps via conda (conda-forge resolves the transitive closure; conda's pip
# silently drops pinned-but-also-conda packages like pandas/typing_extensions).
# cell-gears is PyPI-only and installed with --no-deps so its over-strict == pins
# don't fight conda's versions. Mirrors the `gears` feature in pixi.toml.
dependencies:
- python 3.10.*
- pip
- pytorch 2.3.*
- pytorch_geometric 2.5.*
- numpy 1.26.*
- pandas >=2.2
- scanpy 1.10.*
- anndata >=0.10
- scikit-learn >=1.5
- scipy >=1.11
- networkx >=3
- h5py
- tqdm
- dcor
- requests
- typing_extensions
- session-info
- pip:
  - --no-deps
  - cell-gears==0.1.2
