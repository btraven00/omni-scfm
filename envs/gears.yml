name: gears
channels:
- conda-forge
- bioconda
# Core deps via conda (conda-forge resolves the transitive closure; conda's pip
# silently drops pinned-but-also-conda packages like pandas/typing_extensions).
# cell-gears is PyPI-only; its 0.1.2 deps are unpinned and already provided by
# conda above, so pip just installs the wheel (no PyPI torch pull, no conflict).
# Mirrors the `gears` feature in pixi.toml. (conda's pip rejects `--no-deps` in
# the requirements list, hence relying on the loose deps being pre-satisfied.)
dependencies:
- python 3.10.*
- pip
- pytorch 2.3.*
- pytorch_geometric 2.5.*
- numpy 1.26.*
- pandas >=2.2
- scanpy 1.10.*
- anndata >=0.10
- scikit-learn >=1.5
- scipy >=1.11
- networkx >=3
- h5py
- tqdm
- dcor
- requests
- typing_extensions
- session-info
- pip:
  - cell-gears==0.1.2
