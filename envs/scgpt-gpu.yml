name: scgpt-gpu
channels:
- nvidia      # CUDA 11.7 toolkit (nvcc) to compile flash-attn 1.0.4 — see note below
- conda-forge
- bioconda
# Env for the scGPT method (run_scgpt.py = a pretrained scGPT TransformerGenerator
# fine-tuned per (split, seed) on the GEARS perturbation dataloader). This is the
# BIT-FAITHFUL paper env, curated verbatim from the paper's
#   vendor/paper/benchmark/conda_environments/flashattn_env.yml
# (only the conda layer is loosened — the frozen libgcc/openssl build-strings are
# dropped so conda-forge resolves the toolchain itself; the full pip pin set is kept
# byte-for-byte). Mirror: pixi feature `scgpt-gpu` (curated subset for local dev).
#
# THE FAITHFULNESS-CRITICAL PINS:
#   torch 1.13.1 (PyPI default == the cu117 build, same as the paper's +cu117) +
#   torchvision 0.14.1 / torchaudio 0.13.1 / torchtext 0.14.0 (torchtext 0.14 has the
#   classic GeneVocab API, so NO torchtext shim is needed — unlike a newer stack),
#   flash-attn 1.0.4 (run_scgpt.py sets use_fast_transformer=True => scGPT's
#   TransformerGenerator builds flash_attn.flash_attention.FlashMHA; this is the ONE
#   numerically-load-bearing dep that a "newer stack" would change — do NOT bump it),
#   scgpt 0.2.1, cell-gears 0.0.2 (the fork the paper pins; for norman_from_scfoundation
#   the module shadows it with the VENDORED fork on sys.path, see modules/methods/scgpt/run.sh),
#   numpy 1.23.5, scipy 1.13.0, scanpy 1.10.1, torch-geometric 2.5.3, orbax 0.1.7.
#
# ⚠ DEFERRED BUILD RISK (the one thing not yet validated — see [[scgpt-method]]):
#   flash-attn 1.0.4 compiles a CUDA extension and needs torch importable at BUILD time
#   (`pip install flash-attn==1.0.4 --no-build-isolation` with torch already present).
#   A plain `conda env create -f` may try to build it under isolation (no torch visible)
#   and fail. On the GPU box, build torch first, then flash-attn --no-build-isolation,
#   then the rest. The paper shipped this env pre-built, so it never hit ordering. This
#   is the explicit "build flashattn_env on the target GPU" TODO; the laptop (8GB) can't
#   run the batch=64 train anyway.
dependencies:
- python 3.10.14
- pip
# CUDA 11.7 toolkit to COMPILE flash-attn 1.0.4 (torch's wheel ships only the cu117
# runtime, never nvcc). Matches torch's cu117. If the build wants more headers (cublas
# etc.), add cuda-libraries-dev=11.7.*. FALLBACK if it won't build: relax ONLY flash-attn
# (prebuilt wheel exposing FlashMHA, or use_fast_transformer=False) — keep the rest faithful.
- cuda-nvcc 11.7.*
- cuda-cudart-dev 11.7.*
