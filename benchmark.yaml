name: omni-scfm
id: omni_scfm
description: >
  Benchmarking deep-learning models for gene-perturbation prediction —
  a lean, OmniBenchmark-native reproduction of Ahlmann-Eltze, Huber & Anders
  (Nature Methods 2025). See CITATION.cff for references.
benchmarker: "btraven <ben.uzh@proton.me>"
version: "0.1.0"
api_version: "0.5.0"

software_backend: "conda"

software_environments:
  base:
    name: base scientific env
    description: scanpy/anndata + the omni_scfm shared library (CPU, no torch)
    conda: envs/base.yml
  omni_data:
    name: omni-data download env
    description: hapiq-backed dataset downloader
    conda: envs/omni-data.yml
  r:
    name: R / Bioconductor env
    description: runs the paper's R scripts verbatim (mean, …)
    conda: envs/r.yml
  gears:
    name: GEARS env (paper-pinned)
    description: cell-gears 0.1.2 etc.; GO-filtered split + the additive method
    conda: envs/gears.yml
  gears-gpu:
    name: GEARS GPU env (paper-pinned + CUDA torch)
    description: gears stack with pytorch-gpu for the GEARS method (trains on cuda)
    conda: envs/gears-gpu.yml
  cpa-gpu:
    name: CPA GPU env (paper-pinned)
    description: cpa-tools 0.8.8 / scvi-tools 0.20.3 / torch cu118 for the CPA method (trains on cuda)
    conda: envs/cpa-gpu.yml
  scfoundation-gpu:
    name: scFoundation GPU env (paper-pinned)
    description: forked gears 0.0.2 (vendored) + maeautobin encoder; torch 2.0.1 cu117 + local-attention
    conda: envs/scfoundation-gpu.yml
  scgpt-gpu:
    name: scGPT GPU env (paper-pinned, bit-faithful flashattn_env)
    description: scgpt 0.2.1 + flash-attn 1.0.4 + cell-gears 0.0.2; torch 1.13.1 cu117 (use_fast_transformer=True)
    conda: envs/scgpt-gpu.yml

stages:
  # 1. Download raw data (reproducible, via the omni-data remote module).
  - id: download
    outputs:
      - id: data.raw
        path: "{dataset}.zip"
    modules:
      - id: adamson
        name: "Adamson 2016 (GEARS-processed, Harvard Dataverse)"
        software_environment: "omni_data"
        # NB: additive is degenerate on this single-pert dataset (every "double" is a
        # single -> leakage). `exclude` does not prune in OB 0.5.1, so the collector's
        # DOUBLE_ONLY filter drops additive's single-pert rows instead (see collect.py).
        # cpa + scfoundation + scgpt are norman_from_scfoundation-only (paper scope, first cut).
        exclude: ["additive", "cpa", "scfoundation", "scgpt"]
        repository:
          url: https://github.com/btraven00/omni-data
          commit: fe4df0e  # fix/downloadsh-extensionless-naming (robust naming)
        parameters:
          - uri: "https://dataverse.harvard.edu/api/access/datafile/6154417"
            hash: "md5:0bde631bae60ee8c105991ff0e0d4a20"
      - id: norman
        name: "Norman 2019 (GEARS-processed, Harvard Dataverse) — double perturbations"
        software_environment: "omni_data"
        # cpa + scfoundation + scgpt run only on the scfoundation substrate (first cut);
        # keep them off plain norman. Mirror of the gears `exclude` on norman_from_scfoundation.
        exclude: ["cpa", "scfoundation", "scgpt"]
        repository:
          url: https://github.com/btraven00/omni-data
          commit: fe4df0e
        parameters:
          - uri: "https://dataverse.harvard.edu/api/access/datafile/6154020"
            hash: "md5:cdc41d6050e619c37fd9dd44d440e2b4"
      - id: norman_from_scfoundation
        name: "Norman 2019 (scFoundation-processed, figshare) — the paper's double-pert benchmark substrate"
        software_environment: "omni_data"
        # Keep GEARS off this substrate: stock GEARS here is not the published
        # scfoundation number (that is the fork/embeddings method). Requires OB's
        # transitive+symmetric `exclude` (PR #336 / bug/exclude-behavior). Pairs with
        # the `gears` method module in the methods stage.
        exclude: ["gears"]
        # The raw figshare h5ad (gse133344_…_withtotalcount, 19264 genes); the
        # preprocess stage runs GEARS new_data_process on it. Fetched from the
        # figshare API host: figshare.com/ndownloader returns HTTP 202 (async) which
        # hapiq fetch doesn't poll — the ndownloader.figshare.com host serves directly.
        repository:
          url: https://github.com/btraven00/omni-data
          commit: fe4df0e
        parameters:
          - uri: "https://ndownloader.figshare.com/files/44477939"
            hash: "md5:f9c76065fafa43303dae3f80fe4587a8"

  # 2. Preprocess: extract the processed AnnData + gene names (seed-independent).
  - id: preprocess
    inputs:
      - data.raw
    outputs:
      - id: data.h5ad
        path: "{dataset}.h5ad"
      - id: data.gene_names
        path: "{dataset}.gene_names.json"
      - id: data.go
        path: "{dataset}.go.csv"
    modules:
      - id: gears_h5ad
        name: "processed AnnData + gene names (extract; GEARS new_data_process for scFoundation)"
        # gears env: the scFoundation variant needs cell-gears new_data_process.
        # Dataset-aware single module (mirrors the paper's prepare_perturbation_data.py)
        # because OB 0.5.1 `exclude` does not prune cross-dataset module paths.
        software_environment: "gears"
        repository:
          url: "."
          commit: HEAD
          entrypoint: preprocess

  # 3. Split: GEARS-faithful train/val/test split per seed (paper: 1,2). Runs the
  #    paper's prepare_perturbation_data.py verbatim in the GEARS env so the GO
  #    filtering matches exactly (see THIRD_PARTY.md / docs).
  - id: split
    inputs:
      - data.h5ad
      - data.go
    outputs:
      - id: split.set2conditions
        path: "{dataset}.set2conditions.json"
    modules:
      - id: simulation
        name: "GEARS split (verbatim prepare_perturbation_data.py)"
        software_environment: "gears"
        repository:
          url: "."
          commit: HEAD
          entrypoint: split
        parameters:
          # Seed grid — single source of truth (YAML anchor; alias *seeds elsewhere
          # if another stage ever needs the same set). Paper: singles=1,2 / doubles=1–5;
          # running 2 seeds everywhere for now (testing). Bump the anchor to change all.
          - seed: &seeds [1, 2]

  # 4. Ground truth: observed condition means (scoring target, seed-independent).
  - id: ground_truth
    inputs:
      - data.h5ad
    outputs:
      - id: truth.predictions
        path: "{dataset}.predictions.json.gz"
      - id: truth.gene_names
        path: "{dataset}.gene_names.json"
      - id: truth.predictions_se
        path: "{dataset}.predictions_se.json.gz"
    modules:
      - id: ground_truth
        name: "observed condition means (scoring target)"
        software_environment: "base"
        repository:
          url: "."
          commit: HEAD
          entrypoint: ground_truth

  # 5. Predictive methods (per seed). Baselines first; DL methods later.
  #    Read the preprocess h5ad (picklerick-readable) + the per-seed split;
  #    lineage is download->preprocess->split->methods.
  - id: methods
    inputs:
      - data.h5ad
      - split.set2conditions
      - data.go            # used by additive (GEARS); ignored by mean/lpm
    outputs:
      - id: method.predictions
        path: "{dataset}.predictions.json.gz"
      - id: method.gene_names
        path: "{dataset}.gene_names.json"
    modules:
      - id: mean
        name: "mean prediction baseline (verbatim run_mean_prediction.R)"
        software_environment: "r"
        repository:
          url: "."
          commit: HEAD
          entrypoint: mean
      - id: lpm_selftrained
        name: "linear pretrained model, self-trained (verbatim run_linear_pretrained_model.R)"
        software_environment: "r"
        repository:
          url: "."
          commit: HEAD
          entrypoint: lpm
      - id: additive
        name: "additive model (double-pert linear baseline, verbatim run_additive_model.py)"
        software_environment: "gears"
        repository:
          url: "."
          commit: HEAD
          entrypoint: additive
      # GEARS (GNN). Validated end-to-end on GPU (gears-gpu env + gears_wrapper.py
      # compat shim). Scoped to norman + adamson via the `exclude: ["gears"]` on the
      # norman_from_scfoundation dataset module — stock GEARS on that substrate is NOT
      # the published scfoundation number (that's the fork/embeddings method).
      # Requires OB's transitive+symmetric `exclude` (PR #336 / bug/exclude-behavior).
      - id: gears
        name: "GEARS (GNN; verbatim run_gears.py, stock cell-gears 0.1.2)"
        software_environment: "gears-gpu"
        repository:
          url: "."
          commit: HEAD
          entrypoint: gears
      # CPA (compositional perturbation autoencoder; verbatim run_cpa.py). Scoped to
      # norman_from_scfoundation — the only substrate the paper reports CPA on — via
      # `exclude: ["cpa"]` on the adamson + norman dataset modules (inverse of gears).
      # Reads the bit-exact substrate with stock cell-gears 0.1.2 (rename dodge in
      # run.sh avoids the script's scfoundation-fork branch); the GEARS 0.0.2 fork is
      # deferred to the future scfoundation method, which actually runs the model.
      - id: cpa
        name: "CPA (autoencoder; verbatim run_cpa.py, cpa-tools 0.8.8)"
        software_environment: "cpa-gpu"
        repository:
          url: "."
          commit: HEAD
          entrypoint: cpa
      # scFoundation (foundation model = vendored forked GEARS 0.0.2 + maeautobin encoder).
      # norman_from_scfoundation only (its raison d'être) — `exclude: ["scfoundation"]` on
      # the adamson + norman dataset modules (same inverse-scoping as cpa). Needs the
      # side-loaded checkpoint (OMNI_SCFOUNDATION_CKPT / fetch-scfoundation-model).
      # --- TEMPORARILY DISABLED (focusing the run on scgpt) — re-enable this block ---
      # - id: scfoundation
      #   name: "scFoundation (foundation model; run_scfoundation.py, vendored fork 0.0.2)"
      #   software_environment: "scfoundation-gpu"
      #   repository:
      #     url: "."
      #     commit: HEAD
      #     entrypoint: scfoundation
      #   # GPU knobs surfaced explicitly (passed to run.sh as --batch_size/--epochs).
      #   # batch_size: the PAPER USES 6, but on the real norman_from_scfoundation substrate
      #   # that needs ~23GB and OOMs a 24GB L4 (~22GB usable) — model + GNN graphs are ~18GB
      #   # live and one encoder layer's forward needs ~5GB; no allocator/no_grad trick bridges
      #   # a real need. So we run batch_size=4 here (the encoder activation + per-cell state
      #   # scale with batch). DEVIATION FROM PAPER: batch_size feeds BatchNorm in the GEARS
      #   # head, so 4 != 6 numerically (small, documented). Faithful batch=6 needs a >24GB GPU
      #   # (A100 40GB+). batch_size=1 breaks BatchNorm entirely, so keep it >=2. epochs: paper 15.
      #   parameters:
      #     - batch_size: [4]
      #       epochs: [15]
      # --- end TEMPORARILY DISABLED scfoundation ---
      # scGPT (transformer foundation model; verbatim run_scgpt.py + the side-loaded
      # whole-human checkpoint). FIRST CUT scoped to norman_from_scfoundation only
      # (`exclude: ["scgpt"]` on the adamson + norman dataset modules, same inverse-
      # scoping as cpa/scfoundation). For that substrate run_scgpt.py reuses the SAME
      # vendored forked GEARS 0.0.2 as scfoundation (the module sed-patches its two
      # sys.path inserts). BIT-FAITHFUL env (scgpt-gpu = the paper's flashattn_env:
      # flash-attn 1.0.4 + use_fast_transformer=True). Needs the side-loaded checkpoint
      # DIR (OMNI_SCGPT_MODEL / fetch-scgpt-model). TODO: broaden to adamson/norman (the
      # script's else-branch + stock cell-gears 0.0.2 essential_all_data_pert_genes.pkl).
      - id: scgpt
        name: "scGPT (foundation model; run_scgpt.py, scgpt 0.2.1 + flash-attn 1.0.4)"
        software_environment: "scgpt-gpu"
        repository:
          url: "."
          commit: HEAD
          entrypoint: scgpt
        # GPU knobs surfaced explicitly (passed to run.sh as --batch_size/--epochs).
        # Unlike scfoundation, scGPT has NO BatchNorm in this path (no >=2 floor), but
        # batch_size still sets the SGD averaging granularity -> it DOES change the training
        # trajectory, so faithful = the paper's 64 (don't lower it for the production run).
        # batch=64 needs a >8GB GPU; the laptop port validates plumbing only, the real run
        # is deferred to the target GPU box (see [[scgpt-method]]). epochs: paper 15.
        parameters:
          - batch_size: [64]
            epochs: [15]
